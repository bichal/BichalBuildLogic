# Every mod built on bichal-build-logic. `bichal sync --all`, `bichal check --all`,
# `bichal mods` and .github/workflows/mods.yml work through this list.
#
#   repo:   GitHub repository (Owner/Repo)
#   folder: local checkout next to bichal-build-logic (default: the repository
#           name; BICHAL_MODS_DIR changes the parent folder)
#   private: true for private repositories (only readable with BICHAL_SYNC_TOKEN)

[mods.celeris]
repo = "bichal/Celeris"

[mods.tessera]
repo = "bichal/Tessera"

[mods.velox]
repo = "bichal/velox"
private = true

[mods.dice_and_delish]
repo = "PanzerDevOrg/DiceAndDelish"
folder = "DiceAndDelish"

[mods.bplb]
repo = "bichal/BetterPlayerLocatorBar"
folder = "BetterPlayerLocatorBar"
