# Versions of everything bichal-build-logic compiles against. Build scripts use the
# `libs` accessors (libs.stonecutter.plugin, libs.junit.jupiter, ...). The python tools
# read the [versions] table through tools/bichal_catalog.py (`loom`, `moddev`).
# Mod-facing versions (junit for mods, Stonecutter, Loom...) stay in the common TOML.

[versions]
stonecutter = "0.9.7"
foojay = "1.0.0"
moddev = "2.0.143"
loom = "1.18.3"
gson = "2.14.0"
junit = "6.1.3"

[libraries]
stonecutter-plugin = { module = "dev.kikugie.stonecutter:dev.kikugie.stonecutter.gradle.plugin", version.ref = "stonecutter" }
moddev-plugin = { module = "net.neoforged.moddev:net.neoforged.moddev.gradle.plugin", version.ref = "moddev" }
loom-plugin = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
foojay-plugin = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
